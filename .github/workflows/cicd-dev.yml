name: Java CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        run: ./gradlew clean build -x test -Pspring.profiles.active=dev

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_REPONAME }}:latest .
          docker tag ${{ secrets.DOCKER_REPONAME }}:latest ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest
            docker stop pico-server || true
            docker rm pico-server || true
            # Run the new container
            docker run -d --name pico-server -p 8080:8080 \
            -e DEV_MYSQL_URL="${{ secrets.DEV_MYSQL_URL }}" \
            -e DEV_MYSQL_USERNAME="${{ secrets.DEV_MYSQL_USERNAME }}" \
            -e DEV_MYSQL_PASSWORD="${{ secrets.DEV_MYSQL_PASSWORD }}" \
            -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -e GOOGLE_ANDROID_CLIENT_ID="${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}" \
            -e GOOGLE_IOS_CLIENT_ID="${{ secrets.GOOGLE_IOS_CLIENT_ID }}" \
            -e REDIS_AUTH_HOST="${{ secrets.REDIS_AUTH_HOST }}" \
            -e REDIS_AUTH_PORT="${{ secrets.REDIS_AUTH_PORT }}" \
            -e GOOGLE_ANDROID_WEB_CLIENT_ID="${{ secrets.GOOGLE_ANDROID_WEB_CLIENT_ID }}" \
            -e APPLE_APP_ID="${{ secrets.APPLE_APP_ID }}" \
            -e APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            -e APPLE_KEY_ID="${{ secrets.APPLE_KEY_ID }}" \
            -e APPLE_PRIVATE_KEY="${{ secrets.APPLE_PRIVATE_KEY }}" \
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest
